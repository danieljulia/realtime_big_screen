<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title></title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="double-container">
      <div class="clock-panel">
        <div class="container">
          <img class="hand hand-left" src="">
          <img class="hand hand-right" src="">
          <img class="dospunts" src="">
          <div class="hora"></div>
        </div>
      </div>
      <div class="clock-panel negative">
        <div class="container">
          <img class="hand hand-left" src="">
          <img class="hand hand-right" src="">
          <img class="dospunts" src="">
          <div class="hora"></div>
        </div>
      </div>
    </div>
    <script>
      var config = {
        time_dospunts: 400,
        time_next_xifra: 1200,
        time_next: 1500,
        time_stop: 5,
        negative: false,
        debug: true,
        hand_width_percent: 30,              // hand image width (% of each panel); colon uses 2x this
        hands_center_offset_px: 0,           // fine-tune horizontal centering (+ right, - left)
        hands_offset_bottom_px: 0,           // shift all hands up
        dospunts_left_px: 0,                 // colon (:) offset from panel center
        dospunts_zoom_margin_left_px: 0,     // colon zoom shift
        hora_font_size: 24,                  // clock digits font size (px)
        hora_bottom_px: 20,                  // clock digits distance from bottom
        hora_left_percent: 50,               // clock digits horizontal position
        debug_aspect_ratio: true             // draw red 4:1 aspect ratio guide
      };

      function applyLayoutConfig() {
        const root = document.documentElement;
        root.style.setProperty('--hand-width', config.hand_width_percent + '%');
        root.style.setProperty('--hands-center-offset', config.hands_center_offset_px + 'px');
        root.style.setProperty('--hands-offset-bottom', config.hands_offset_bottom_px + 'px');
        root.style.setProperty('--dospunts-left', config.dospunts_left_px + 'px');
        root.style.setProperty('--dospunts-zoom-margin-left', config.dospunts_zoom_margin_left_px + 'px');
        root.style.setProperty('--hora-font-size', config.hora_font_size + 'px');
        root.style.setProperty('--hora-bottom', config.hora_bottom_px + 'px');
        root.style.setProperty('--hora-left', config.hora_left_percent + '%');
        applyAspectRatioDebug();
      }

      function applyAspectRatioDebug() {
        var el = document.getElementById('aspect-ratio-debug');
        if (config.debug_aspect_ratio) {
          if (!el) {
            el = document.createElement('div');
            el.id = 'aspect-ratio-debug';
            el.className = 'aspect-ratio-debug';
            document.body.appendChild(el);
          }
          el.style.display = 'block';
        } else if (el) {
          el.style.display = 'none';
        }
      }

      applyLayoutConfig();
    </script>
    <script src="js/timecode.js"></script>
  </body>
</html>
